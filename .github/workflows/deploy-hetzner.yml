name: Deploy to Hetzner (FTP)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    environment: FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write deploy version file
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > deploy-version.json <<EOF
          {
            "version": "${GITHUB_SHA}",
            "deployed_at": "${DEPLOYED_AT}"
          }
          EOF

      - name: Validate required FTP secrets
        env:
          FTP_SERVER_EFFECTIVE: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          FTP_USERNAME_EFFECTIVE: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          FTP_PASSWORD_EFFECTIVE: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          FTP_REMOTE_DIR_EFFECTIVE: ${{ secrets.FTP_REMOTE_DIR || secrets.REMOTE_DIR }}
        run: |
          test -n "$FTP_SERVER_EFFECTIVE"
          test -n "$FTP_USERNAME_EFFECTIVE"
          test -n "$FTP_PASSWORD_EFFECTIVE"
          test -n "$FTP_REMOTE_DIR_EFFECTIVE"

      - name: Normalize remote directory
        id: normalize_remote_dir
        env:
          FTP_REMOTE_DIR_EFFECTIVE: ${{ secrets.FTP_REMOTE_DIR || secrets.REMOTE_DIR }}
        run: |
          dir="$FTP_REMOTE_DIR_EFFECTIVE"
          case "$dir" in
            */) ;;
            *) dir="$dir/" ;;
          esac
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./
          server-dir: ${{ steps.normalize_remote_dir.outputs.server_dir }}
          exclude: |
            **/.git*/**
            **/.github/**
            **/config.php
            **/*.log
            **/.DS_Store
            **/Thumbs.db