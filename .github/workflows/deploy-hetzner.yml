name: Deploy to Hetzner (FTP)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    environment: FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write deploy version file
        run: |
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > deploy-version.json <<EOF
          {
            "version": "${GITHUB_SHA}",
            "deployed_at": "${DEPLOYED_AT}"
          }
          EOF

      - name: Version asset links in index.php
        # assets/css/x.css?v=dev -> assets/css/x.css?v=<sha256 of the file, 12 chars>.
        # Unchanged files keep their link, so browsers keep them cached (see .htaccess, section 2).
        run: |
          for f in $(grep -oE 'assets/(css|js)/[A-Za-z0-9._/-]+\?v=dev' index.php | sed 's/?v=dev$//' | sort -u); do
            test -f "$f" || { echo "missing asset: $f"; exit 1; }
            h="$(sha256sum "$f" | cut -c1-12)"
            sed -i "s|$f?v=dev|$f?v=$h|g" index.php
            echo "$f -> v=$h"
          done
          if grep -q '?v=dev' index.php; then echo "unversioned ?v=dev left in index.php"; exit 1; fi
          # build shown next to the logo (deploy-refresh.js, ?showversion=1)
          sed -i "s|<meta name=\"lwhub-build\" content=\"dev\">|<meta name=\"lwhub-build\" content=\"${GITHUB_SHA}\">|" index.php
          grep -q "lwhub-build\" content=\"${GITHUB_SHA}\"" index.php || { echo "lwhub-build meta not set"; exit 1; }

      - name: Validate required FTP secrets
        env:
          FTP_SERVER_EFFECTIVE: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          FTP_USERNAME_EFFECTIVE: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          FTP_PASSWORD_EFFECTIVE: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          FTP_REMOTE_DIR_EFFECTIVE: ${{ secrets.FTP_REMOTE_DIR || secrets.REMOTE_DIR }}
        run: |
          test -n "$FTP_SERVER_EFFECTIVE"
          test -n "$FTP_USERNAME_EFFECTIVE"
          test -n "$FTP_PASSWORD_EFFECTIVE"
          test -n "$FTP_REMOTE_DIR_EFFECTIVE"

      - name: Normalize remote directory
        id: normalize_remote_dir
        env:
          FTP_REMOTE_DIR_EFFECTIVE: ${{ secrets.FTP_REMOTE_DIR || secrets.REMOTE_DIR }}
        run: |
          dir="$FTP_REMOTE_DIR_EFFECTIVE"
          case "$dir" in
            */) ;;
            *) dir="$dir/" ;;
          esac
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      # The entry page (index.php), the root .htaccess (rewrites to index.php) and the version file go up LAST,
      # so no page ever links to assets that are not on the server yet (assets are cached for a year).
      # They are moved out of the upload folder instead of using "exclude": the action matches exclude
      # patterns with matchBase, so "index.html" or ".htaccess" would also skip web-scanner-onnx/index.html,
      # views/.htaccess etc. The state file never lists these three files, so pass 1 never deletes them.
      - name: Hold back entry files for pass 2
        run: |
          mkdir -p "$RUNNER_TEMP/entry"
          mv index.php .htaccess deploy-version.json "$RUNNER_TEMP/entry/"

      - name: Deploy via FTP/FTPS (pass 1, assets first)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          state-name: .ftp-deploy-sync-state-v3.json
          server: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          username: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          security: loose
          local-dir: ./
          server-dir: ${{ steps.normalize_remote_dir.outputs.server_dir }}
          # Patterns without "/" match in EVERY folder (matchBase), so only list what must never be uploaded.
          exclude: |
            **/.git*/**
            **/.github/**
            **/config.php
            **/CLAUDE.md
            **/*.log
            **/.DS_Store
            **/Thumbs.db

      - name: Deploy entry files last (pass 2)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          SERVER_DIR: ${{ steps.normalize_remote_dir.outputs.server_dir }}
        run: |
          dir="$SERVER_DIR"
          case "$dir" in
            /*) path="%2F${dir#/}" ;;   # absolute path on the FTP server
            ./*) path="${dir#./}" ;;
            *) path="$dir" ;;
          esac
          cd "$RUNNER_TEMP/entry"
          for f in index.php .htaccess deploy-version.json; do
            curl --fail --silent --show-error --ssl-reqd --insecure --ftp-pasv --retry 3               --user "$FTP_USERNAME:$FTP_PASSWORD" -T "$f" "ftp://$FTP_SERVER:$FTP_PORT/$path"
            echo "uploaded $f"
          done