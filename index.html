<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lwhub</title>
<style>
  :root {
    --bg: #0f1320;
    --card: #171c2d;
    --line: #2a3452;
    --text: #edf2ff;
    --soft: #aab6d3;
    --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Inter, Segoe UI, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 10%, rgba(74,158,255,0.2), transparent 28%),
      linear-gradient(160deg, var(--bg), #0b0f1a);
  }
  .card {
    width: min(560px, 92vw);
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 90%, transparent);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    letter-spacing: 0.5px;
  }
  p {
    margin: 0;
    color: var(--soft);
    line-height: 1.6;
  }
  a {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 700;
    background: linear-gradient(135deg, #3f8ef5, #5aa7ff);
    border: 1px solid rgba(255,255,255,0.15);
  }
  a:hover { filter: brightness(1.05); }
</style>
</head>
<body>
  <main class="card">
    <h1>lwhub</h1>
    <p>Die INY-App ist jetzt auf der Subdomain erreichbar.</p>
    <a href="https://iny.lwhub.de">Weiter zu iny.lwhub.de</a>
  </main>
</body>
</html>
